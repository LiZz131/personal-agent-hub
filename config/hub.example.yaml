# Hub instance config. Copy to config/hub.yaml and edit. No secrets here (secrets go in .env).
# 实例配置：复制为 config/hub.yaml 后修改。这里不放密钥（密钥放 .env）。

# Language of prompts and cards the hub generates (zh | en).
# 中枢生成的提示词和卡片使用的语言。
language: zh

# Optional: a read-only folder with notes about you (identity.md, principles.md, research.md ...).
# Agents read it to tailor explanations. Leave empty if you don't have one.
# 可选：使用者档案目录（只读），agent 据此调整讲解深度。没有就留空。
memory_dir:

# Claude Code CLI.
claude_bin: ~/.local/bin/claude.exe

# Models for background jobs. 后台任务用的模型。
models:
  triage: haiku       # event triage / 事件分诊
  relay: haiku        # relays a message to a running session / 给运行中的会话转达消息
  exp_draft: sonnet   # experiment record drafts / 实验记录草稿

# Optional Notion integration: data source ids such as "collection://xxxx".
# Schema: docs/design/notion-structure.md. Leave empty to disable.
# 可选的 Notion 集成：各库的 data source id，留空即不启用。
notion:
  tasks:
  experiments:
  projects:

cc_connect:
  exe: tools/cc-connect/cc-connect.exe
